services:
  streaming:
    # O app passa pelo Caddy (HTTPS, porta 8446). A porta das telas fica direto no IP da VM:
    # a TV e o projetor tocam por DLNA, que não aceita o nosso certificado.
    ports: !override
      - "192.168.1.20:8447:8081"
    environment:
      URL_DAS_TELAS: http://192.168.1.20:8447
      # No container, o servidor não vê a rede de casa: a procura de telas varre esta.
      REDE_LOCAL: 192.168.1.0/24
      # Buscador de torrents (S19), na mesma rede do Docker; a chave da API vai em Ajustes.
      PROWLARR_URL: http://prowlarr:9696
      # Whisper compartilhado do homelab (S26), na mesma rede do Docker.
      WHISPER_URL: http://whisper:8000
      # Parakeet compartilhado do homelab (S29): gera legendas pelo áudio.
      PARAKEET_URL: http://parakeet:8000
      # App Flashcards (S31): a frase tocada na legenda vira cartão no baralho Inglês.
      FLASHCARDS_URL: http://flashcards:8080
      # A busca das telas (SSDP) fica com o procurador, que está na rede do servidor.
      PROCURADOR_DE_TELAS: http://host.docker.internal:8452
      # Avisos no celular (S35): o ntfy do homelab (homelab/ntfy), tópico "streaming".
      NTFY_URL: http://ntfy/streaming
      CLAUDE_TOKEN_ARQUIVO: /claude/token
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /srv/data/streaming:/data
      # A conta do Claude escolhida no Hub (H11 do Hub), lida a cada chamada; só leitura.
      - /srv/data/claude/ativa:/claude:ro
    networks:
      - proxy

  # O mesmo binário, só com a busca de telas: o multicast do SSDP não sai da rede do Docker, e o
  # projetor responde de outra porta, que o NAT descarta. Escuta só na ponte do Docker (docker0).
  procurador:
    image: streaming:${VERSION:-dev}
    pull_policy: never
    command: ["procurador"]
    restart: unless-stopped
    network_mode: host
    environment:
      ADDR: 172.17.0.1:8452
    depends_on:
      - streaming

networks:
  proxy:
    external: true
